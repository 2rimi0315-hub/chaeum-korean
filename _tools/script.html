<script>
let mode = null;
const passage = document.getElementById('passage');
if(passage){
passage.querySelectorAll('p').forEach(p=>{
  p.innerHTML = p.textContent.split(/(\s+)/).map(t=>
    t.trim() ? '<span class="w">'+t+'</span>' : t
  ).join('');
});
passage.addEventListener('click', e=>{
  if(!e.target.classList.contains('w') || !mode) return;
  if(mode==='erase'){ e.target.classList.remove('unknown','important','env'); return; }
  ['unknown','important','env'].forEach(c=>{ if(c!==mode) e.target.classList.remove(c); });
  e.target.classList.toggle(mode);
});
}
function setMode(m){
  mode = (mode===m) ? null : m;
  ['unknown','important','env','erase'].forEach(x=>{
    const b = document.getElementById('btn-'+x);
    if(b) b.classList.toggle('active-'+x, mode===x);
  });
}

function pickFace(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

document.querySelectorAll('.choicepair, .mc').forEach(group=>{
  group.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      group.querySelectorAll('button').forEach(b=>b.classList.remove('picked','correct','wrong'));
      btn.classList.add('picked');
    };
  });
});

function grade(){
  let total=0, ok=0;
  document.querySelectorAll('[data-q]').forEach(group=>{
    total++;
    const ans = group.dataset.answer;
    const picked = group.querySelector('.picked, .correct, .wrong');
    const btns = [...group.querySelectorAll('button')];
    btns.forEach(b=>b.classList.remove('correct','wrong'));
    if(!picked) return;
    const val = group.classList.contains('mc') ? String(btns.indexOf(picked)+1) : picked.textContent.trim();
    if(val===ans){ picked.classList.add('correct'); ok++; }
    else{
      picked.classList.add('wrong');
      const right = group.classList.contains('mc') ? btns[Number(ans)-1] : btns.find(b=>b.textContent.trim()===ans);
      if(right) right.classList.add('correct');
    }
    picked.classList.remove('picked');
  });
  const r = document.getElementById('result');
  if(ok===total){ r.textContent = '🎉 모두 맞았어요! 정말 잘했어요!'; r.style.color = 'var(--teal)'; }
  else{ r.textContent = ok+' / '+total+' 맞았어요. 틀린 문제는 이야기를 다시 읽고 도전해 보세요!'; r.style.color = 'var(--tangerine-dark)'; }
}

document.querySelectorAll('.rvgroup').forEach(group=>{
  const ans = group.dataset.ranswer;
  group.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      group.querySelectorAll('button').forEach(b=>b.classList.remove('correct','wrong'));
      if(btn.dataset.v===ans){ btn.classList.add('correct'); }
      else{
        btn.classList.add('wrong');
        group.querySelectorAll('button').forEach(b=>{ if(b.dataset.v===ans) b.classList.add('correct'); });
      }
    };
  });
});

/* 문제 표시(△/☆) 버튼 */
function addQmark(p){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'qmark'; b.textContent = '◻';
  b.setAttribute('aria-label', '문제 표시: 누를 때마다 빈칸, 세모, 별로 바뀜');
  const states = ['◻','△','☆']; let i = 0;
  b.onclick = ()=>{ i = (i+1)%3; b.textContent = states[i]; b.classList.toggle('marked', i>0); };
  p.appendChild(b);
}
document.querySelectorAll('.choicepair').forEach(g=>{
  const p = g.previousElementSibling;
  if(p && p.tagName === 'P') addQmark(p);
});
document.querySelectorAll('.quiz .qtitle').forEach(p=>{
  if(p.closest('.quiz').querySelector('.mc')) addQmark(p);
});
</script>
</html>
