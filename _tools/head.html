<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동지 — 어머니의 시험 (국어 4-1)</title>
<style>
  :root{
    --ink:#2E2B26;
    --paper:#FFFDF8;
    --tangerine:#E8762C; --tangerine-bg:#FBEEE2; --tangerine-dark:#7A3A0E;
    --teal:#1D9E75; --teal-bg:#E1F5EE; --teal-dark:#085041;
    --purple:#7F77DD; --purple-bg:#EEEDFE; --purple-dark:#3C3489;
    --line:#E3DDD0;
    --mark-unknown:#F4C0D1;
    --mark-env:#BFE3F7;
    --mark-important:#FAE28A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.7; padding:28px 18px 80px;
  }
  .wrap{max-width:780px; margin:0 auto;}

  .top{border-bottom:3px solid var(--ink); padding-bottom:16px; margin-bottom:8px;}
  .eyebrow{font-size:13px; letter-spacing:0.14em; color:#9A937F; margin-bottom:4px;}
  h1{font-size:27px; font-weight:800; letter-spacing:-0.02em; line-height:1.35;}
  h1 em{font-style:normal; color:var(--purple);}
  .idrow{display:flex; gap:20px; margin-top:12px; font-size:14px; flex-wrap:wrap;}
  .idrow span{display:flex; align-items:center; gap:8px;}
  .idrow input{border:none; border-bottom:2px solid var(--line); background:transparent; width:110px; font-size:15px; font-family:inherit; padding:2px 4px;}

  section{margin-top:44px;}
  .stage{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .stage .badge{
    font-size:13px; font-weight:800; letter-spacing:0.1em; color:#fff;
    padding:5px 14px; border-radius:999px;
  }
  .stage h2{font-size:20px; font-weight:800;}
  .s-intro .badge{background:var(--purple);}
  .s-main .badge{background:var(--teal);}
  .s-wrap .badge{background:var(--tangerine);}
  .s-review .badge{background:#5F5E5A;}

  .box{background:#fff; border:2px solid var(--ink); border-radius:16px; padding:22px; margin-bottom:16px;}
  .task{display:flex; gap:10px; align-items:baseline; margin-bottom:10px;}
  .task .no{
    flex:none; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; transform:translateY(4px);
  }
  .task p{font-size:16px; font-weight:600;}
  .task p small{display:block; font-weight:400; font-size:13px; color:#8A8271;}

  .writeline{
    width:100%; min-height:44px; border:none; border-bottom:2px dashed var(--line);
    background:transparent; font-family:inherit; font-size:16px; padding:8px 4px; resize:vertical; line-height:1.7;
  }
  .writeline:focus{outline:none; border-bottom-color:var(--teal);}

  .comic{margin-bottom:22px;}
  .comic .clabel{font-size:15px; font-weight:800; margin-bottom:8px;}
  .comic .clabel small{display:block; font-weight:400; font-size:13px; color:#8A8271;}
  .cowrap{border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; background:#fff;}
  .cowrap img{width:100%; display:block;}
  .cocap{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); border-top:2.5px solid var(--ink); background:#FBFAF5;}
  .cocap span{padding:10px 12px; font-size:13.5px; font-weight:600; line-height:1.5; border-left:1.5px solid var(--line);}
  .cocap span:first-child{border-left:none;}
  .cocap span b{color:#E8762C; margin-right:4px;}
  .say{
    background:var(--purple-bg); color:var(--purple-dark); border-radius:12px;
    padding:12px 16px; font-size:15px; margin:8px 0 14px;
  }
  .say b{font-weight:800;}

  .marktools{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .marktools button{
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    padding:9px 16px; border-radius:999px; border:2px solid var(--ink); background:#fff; color:var(--ink);
  }
  .marktools button.active-unknown{background:var(--mark-unknown); border-color:#D4537E;}
  .marktools button.active-important{background:var(--mark-important); border-color:#BA7517;}
  .marktools button.active-env{background:var(--mark-env); border-color:#2B7DB0;}
  .marktools button.erase.active-erase{background:#EDEAE1;}
  .ptitle{
    text-align:center; font-size:19px; font-weight:800; letter-spacing:-0.01em;
    margin:6px 0 18px; padding-bottom:12px; border-bottom:2px solid var(--line);
  }
  .ptitle small{display:block; font-size:12px; font-weight:700; letter-spacing:0.14em; color:#9A937F; margin-bottom:4px;}
  .passage{font-size:17px; line-height:2.1;}
  .passage p{margin-bottom:14px;}
  .passage .w{cursor:pointer; border-radius:4px; padding:1px 1px;}
  .passage .w.unknown{background:var(--mark-unknown);}
  .passage .w.important{background:var(--mark-important);}
  .passage .w.env{background:var(--mark-env);}
  .legendline{display:flex; gap:16px; font-size:13px; color:#8A8271; margin-top:10px; flex-wrap:wrap;}
  .legendline i{display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:5px; vertical-align:-2px;}

  table{width:100%; border-collapse:collapse; font-size:15px;}
  th{background:var(--teal-bg); color:var(--teal-dark); font-size:13px; letter-spacing:0.06em; padding:10px; border:1.5px solid var(--ink); font-weight:800;}
  td{border:1.5px solid var(--ink); padding:8px 10px; vertical-align:middle;}
  td.word{font-weight:800; font-size:16px; text-align:center; background:#FBFAF5; width:96px;}
  td input{width:100%; border:none; background:transparent; font-family:inherit; font-size:15px; padding:4px;}
  td input:focus{outline:2px solid var(--teal-bg); border-radius:4px;}

  .combine{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px;}
  .combine .chip{
    border:2px solid var(--teal); border-radius:12px; padding:10px 12px; text-align:center;
    background:var(--teal-bg); color:var(--teal-dark); font-size:15px;
  }
  .combine .chip b{font-size:16px;}
  .combine .chip small{display:block; font-size:12px; color:#4E8E77; font-weight:700;}
  .combine .chip input{width:100%; border:none; border-top:1.5px dashed var(--teal); margin-top:6px; padding-top:6px; text-align:center; background:transparent; font-family:inherit; font-size:15px; font-weight:700; color:var(--teal-dark);}

  .mapwrap{display:flex; flex-direction:column; align-items:center; gap:0; padding:8px 0;}
  .center-node{
    width:120px; height:120px; border-radius:50%; background:var(--tangerine); color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:15px; font-weight:800; padding:10px; position:relative; z-index:1;
  }
  .stem{width:3px; height:26px; background:var(--ink);}
  .branches{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; position:relative; padding-top:26px;}
  .branches::before{content:""; position:absolute; top:0; left:16.6%; right:16.6%; height:3px; background:var(--ink);}
  .branch{position:relative;}
  .branch::before{content:""; position:absolute; top:-26px; left:50%; width:3px; height:26px; background:var(--ink);}
  .bcard{border:2px solid var(--ink); border-radius:14px; background:#fff; overflow:hidden;}
  .bcard h3{font-size:15px; font-weight:800; text-align:center; padding:9px;}
  .bcard.b1 h3{background:var(--teal-bg); color:var(--teal-dark);}
  .bcard.b2 h3{background:var(--purple-bg); color:var(--purple-dark);}
  .bcard.b3 h3{background:var(--tangerine-bg); color:var(--tangerine-dark);}
  .bcard textarea{width:100%; border:none; min-height:88px; padding:10px; font-family:inherit; font-size:14px; resize:vertical; background:transparent; line-height:1.6;}
  .bcard textarea:focus{outline:none; background:#FBFAF5;}
  .bcard .lab{font-size:12px; color:#9A937F; padding:0 10px;}

  .flowlist{margin-top:20px;}
  .flowrow{display:flex; gap:10px; align-items:baseline; margin-bottom:6px;}
  .flowrow .fno{
    flex:none; width:30px; height:30px; border-radius:50%; background:var(--skyblue,#2E86C1); color:#fff;
    font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; transform:translateY(6px);
    background:#2E86C1;
  }
  .flowrow textarea{flex:1;}
  .flowrow .fixed{flex:1; background:#FBF3DC; border:1.5px solid #E8C56A; border-radius:10px; padding:10px 14px; font-size:15px; line-height:1.7;}
  .flowarrow{text-align:center; color:#B4AE9D; font-size:16px; margin:-2px 0 4px; font-weight:800;}

  .selfcheck{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .selfcheck p{flex:1 1 260px; font-size:15px; font-weight:600;}
  .faces{display:flex; gap:10px;}
  .faces button{
    width:64px; height:64px; border-radius:16px; border:2px solid var(--line); background:#fff;
    font-size:26px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:inherit;
  }
  .faces button small{font-size:11px; color:#8A8271; font-weight:700;}
  .faces button.sel{border-color:var(--tangerine); background:var(--tangerine-bg); transform:scale(1.06);}

  .quiz{margin-bottom:20px;}
  .quiz .qtitle{font-size:16px; font-weight:700; margin-bottom:8px;}
  .choicepair{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 10px;}
  .choicepair button, .mc button{
    font-family:inherit; font-size:15px; cursor:pointer; text-align:left;
    padding:9px 16px; border-radius:999px; border:2px solid var(--line); background:#fff;
  }
  .mc{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .mc button{border-radius:12px;}
  .picked{border-color:var(--ink) !important; background:#F3F0E7 !important; font-weight:700;}
  .correct{border-color:var(--teal) !important; background:var(--teal-bg) !important; font-weight:700;}
  .wrong{border-color:#E24B4A !important; background:#FCEBEB !important;}
  .boki{background:#FBFAF5; border:1.5px dashed var(--ink); border-radius:12px; padding:14px 16px; font-size:14.5px; margin:8px 0 10px;}
  .fixline{margin-top:12px; background:#FBFAF5; border:1.5px dashed var(--line); border-radius:10px; padding:12px 14px;}
  .fixline p{font-size:14px; font-weight:600; margin-bottom:2px;}
  .fixline p small{font-weight:400; color:#8A8271;}
  .qmark{margin-left:8px; font-size:15px; width:32px; height:32px; border-radius:8px;
    border:1.5px dashed var(--line); background:#fff; cursor:pointer; padding:0;
    vertical-align:-4px; font-family:inherit; color:#B4AE9D;}
  .qmark.marked{border-style:solid; border-color:#BA7517; color:#7A3A0E; background:#FAEEDA; font-weight:800;}
  .checkbtn{
    font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; color:#fff;
    background:var(--ink); border:none; border-radius:999px; padding:12px 26px;
  }
  #result{font-size:16px; font-weight:800; margin-top:12px; min-height:24px;}

  .rv{margin-bottom:14px;}
  .rv p.q{font-size:15px; font-weight:600; margin-bottom:6px;}
  .rv p.q i{font-style:normal; color:#6B6858; font-weight:400;}
  .rvgroup{display:flex; gap:8px; flex-wrap:wrap;}
  .rvgroup button{
    font-family:inherit; font-size:15px; cursor:pointer;
    padding:9px 16px; border-radius:999px; border:2px solid var(--line); background:#fff;
  }

  @media print{
    body{padding:0; background:#fff;}
    .marktools, .checkbtn, #result{display:none !important;}
    section{break-inside:avoid; margin-top:24px;}
    .box{border-width:1.5px;}
    .writeline{border-bottom:1.5px dashed #999;}
  }
</style>
</head>
